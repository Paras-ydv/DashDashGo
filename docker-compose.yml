name: dashdashgo

x-clickhouse-env: &clickhouse-env
  CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-clickhouse}
  CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}

services:
  # ---------------------------------------------------------------------------
  # Destination warehouse + pipeline metadata
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Demo environment: the dashboard DashDashGo acquires reports from.
  # Postgres hosts Metabase's application DB and a small "upstream warehouse".
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      DEMO_READER_PASSWORD: ${DEMO_READER_PASSWORD:?set DEMO_READER_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d warehouse"]
      interval: 5s
      timeout: 3s
      retries: 30

  metabase:
    image: metabase/metabase:v0.63.18.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: postgres
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      JAVA_TIMEZONE: UTC
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # One-shot: creates the demo dashboards/questions in Metabase (idempotent).
  # The script is standard-library only, so it runs on a stock Python image.
  metabase-seed:
    image: python:3.12-slim-bookworm
    command: ["python", "/demo/metabase_seed.py"]
    volumes:
      - ./demo:/demo:ro
    depends_on:
      metabase:
        condition: service_healthy
    environment:
      METABASE_URL: http://metabase:3000
      METABASE_USERNAME: ${METABASE_USERNAME:?set METABASE_USERNAME in .env}
      METABASE_PASSWORD: ${METABASE_PASSWORD:?set METABASE_PASSWORD in .env}
      DEMO_READER_PASSWORD: ${DEMO_READER_PASSWORD}
      DEMO_WAREHOUSE_HOST: postgres
    restart: "no"

  # ---------------------------------------------------------------------------
  # DashDashGo: API + UI + scheduler (http://localhost:8000)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      # `runtime` for the service; `test` adds pytest + tests (make test-e2e, CI).
      target: ${APP_BUILD_TARGET:-runtime}
    image: dashdashgo:${APP_BUILD_TARGET:-runtime}
    depends_on:
      clickhouse:
        condition: service_healthy
      metabase-seed:
        condition: service_completed_successfully
    environment:
      <<: *clickhouse-env
      CLICKHOUSE_METADATA_DATABASE: ${CLICKHOUSE_METADATA_DATABASE:-dashdashgo}
      METABASE_URL: ${METABASE_URL:-http://metabase:3000}
      METABASE_USERNAME: ${METABASE_USERNAME}
      METABASE_PASSWORD: ${METABASE_PASSWORD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      STORAGE_RETENTION_DAYS: ${STORAGE_RETENTION_DAYS:-30}
      # Security (see README "Security"); empty = defaults / disabled.
      AUTH_USERNAME: ${AUTH_USERNAME:-}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      CONFIG_ENV_ALLOWLIST: ${CONFIG_ENV_ALLOWLIST:-}
      ALLOWED_DASHBOARD_HOSTS: ${ALLOWED_DASHBOARD_HOSTS:-}
      # Optional AI assistant; disabled while AI_API_KEY is empty.
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - app-storage:/data/storage
      # Editable report configs (UI editor / `dashdashgo config`), seeded from
      # ./reports on first start and re-read on every run.
      - app-reports:/data/reports
    init: true          # reap orphaned browser processes
    shm_size: "1gb"     # Chromium needs more than Docker's 64 MB default /dev/shm
    restart: unless-stopped

volumes:
  clickhouse-data:
  postgres-data:
  app-storage:
  app-reports:
