[project]
name = "dashdashgo"
version = "1.0.0"
description = "Configuration-driven dashboard report acquisition, transformation and ClickHouse ingestion."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "apscheduler>=3.11,<4",
    "clickhouse-connect>=0.8",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "playwright>=1.50",
    "pyarrow>=17",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[project.scripts]
dashdashgo = "dashdashgo.cli:main"

[dependency-groups]
# Installed in the Docker image so the e2e suite can run inside the stack.
test = [
    "httpx>=0.27",
    "pytest>=8.3",
]
dev = [
    { include-group = "test" },
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dashdashgo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not e2e'"
markers = [
    "integration: needs a running ClickHouse (make test-integration)",
    "e2e: needs the full stack incl. Metabase and a browser (make test-e2e)",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    # third-party deprecations inside Starlette's TestClient, not our code
    "ignore::DeprecationWarning:starlette.testclient",
    "ignore:Using `httpx` with `starlette.testclient`",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "demo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "BLE", "RET", "C4", "PT"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PT011", "PT018"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["dashdashgo"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["clickhouse_connect.*", "apscheduler.*", "openpyxl.*", "pyarrow.*"]
ignore_missing_imports = true
